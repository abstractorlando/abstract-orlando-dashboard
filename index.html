function fc(n) { return n==null ? '—' : '$'+n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function fn(n) { return n==null ? '—' : n; }
function pp(a,b) { return b ? Math.min(Math.round((a/b)*100),100) : 0; }
function gc(v,t) { if(v==null||t==null) return 'neutral'; return v>=t ? 'good' : v>=t*0.8 ? 'warn' : 'bad'; }
function gf(v,t) { if(v==null||t==null) return 'fill-warn'; return v>=t ? 'fill-good' : v>=t*0.8 ? 'fill-warn' : 'fill-bad'; }

function destroyCharts() {

function simpleCard(name, val, color) {

}

function splitCard(name, aVal, bVal, aColor, bColor, aLabel, bLabel) {
  var hasSplit = aVal !== null && aVal !== undefined;
  if (!hasSplit) {
    return '<div class="promo-card"><div class="promo-name">'+name+'</div><div class="promo-val" style="color:'+(aColor||'var(--text)')+'">'+fn(bVal)+'</div></div>';

  return '<div class="promo-card">'

    +'</div>'
    +'<div class="promo-sub">'+(aLabel||'Booked')+' → '+(bLabel||'Used')+'</div>'
    +'</div>';
}

  promoHTML += splitCard('Groupon Canvas', w.gc_i, w.gc_u, 'var(--amber)', 'var(--green)', 'Issued', 'Used');
  promoHTML += splitCard('Golden Ticket', w.gt_i, w.gt_u, 'var(--amber)', 'var(--green)', 'Issued', 'Used');

  document.getElementById('main').innerHTML = '<div class="fade-in">'
    +'<div class="kpi-row">'
    +'<div class="kpi '+gc(w.total,T.total)+'"><div class="kpi-label">Total Revenue</div><div class="kpi-value">'+fc(w.total)+'</div><div class="kpi-target">Target '+fc(T.total)+' '+revBadge+'</div><div class="progress-wrap"><div class="progress-bar"><div class="progress-fill '+gf(w.total,T.total)+'" style="width:'+pp(w.total,T.total)+'%"></div></div></div></div>'
    +'<div class="kpi neutral"><div class="kpi-label">FareHarbor</div><div class="kpi-value">'+fc(w.fh)+'</div><div class="kpi-target">'+(w.total&&w.fh?pp(w.fh,w.total)+'% of total':'')+'</div></div>'
    +'<div class="kpi neutral"><div class="kpi-label">Toast (In-Studio)</div><div class="kpi-value">'+fc(w.toast)+'</div><div class="kpi-target">'+(w.total&&w.toast?pp(w.toast,w.total)+'% of total':'')+'</div></div>'
    +'<div class="kpi '+gc(w.tipPct,T.tipPct)+'"><div class="kpi-label">Tip Rate</div><div class="kpi-value">'+(w.tipPct!=null?w.tipPct.toFixed(1)+'%':'—')+'</div><div class="kpi-target">Target 15% '+tipBadge+'</div></div>'
    +'<div class="kpi '+gc(w.reviews,T.reviews)+'"><div class="kpi-label">Reviews</div><div class="kpi-value">'+fn(w.reviews)+'</div><div class="kpi-target">Target '+T.reviews+' '+revBadge2+'</div><div class="progress-wrap"><div class="progress-bar"><div class="progress-fill '+gf(w.reviews,T.reviews)+'" style="width:'+pp(w.reviews,T.reviews)+'%"></div></div></div></div>'
    +'</div>'
    +'<div class="section-title"><span class="dot dot-pink"></span> Revenue Breakdown</div>'
    +'<div class="charts-grid"><div class="chart-card"><div class="chart-title">Revenue split</div><div style="position:relative;height:200px"><canvas id="revenueChart"></canvas></div></div><div class="chart-card"><div class="chart-title">Tips & gratuity</div><div style="position:relative;height:200px"><canvas id="tipChart"></canvas></div></div></div>'
    +'<div class="section-title"><span class="dot dot-teal"></span> Guests</div>'
    +'<div class="guest-row"><div class="guest-pill"><div class="guest-pill-label">First Time</div><div class="guest-pill-val" style="color:var(--pink)">'+fn(w.ft)+'</div></div><div class="guest-pill"><div class="guest-pill-label">Returning</div><div class="guest-pill-val" style="color:var(--teal)">'+fn(w.rg)+'</div></div><div class="guest-pill"><div class="guest-pill-label">Total Guests</div><div class="guest-pill-val">'+fn(w.guests)+'</div></div><div class="guest-pill"><div class="guest-pill-label">Pickups</div><div class="guest-pill-val" style="color:var(--purple)">'+fn(w.pickups)+'</div></div></div>'
    +'<div class="section-title"><span class="dot dot-purple"></span> Promotions <span style="font-size:10px;color:var(--muted);font-family:DM Sans,sans-serif;font-style:normal">&nbsp;— split cards show two numbers</span></div>'
    +'<div class="promo-grid">'+promoHTML+'</div>'
    +'<div class="section-title"><span class="dot dot-pink"></span> Payroll & Margin</div>'
    +'<div class="payroll-row"><div class="payroll-card"><div class="payroll-label">Payroll</div><div class="payroll-val" style="color:var(--red)">'+fc(w.payroll)+'</div><div style="font-size:11px;color:var(--muted);margin-top:4px">'+(w.total&&w.payroll?pp(w.payroll,w.total)+'% of revenue':'')+'</div></div><div class="payroll-card"><div class="payroll-label">Gross Margin</div><div class="payroll-val" style="color:'+(margin!=null&&margin>0?'var(--green)':'var(--red)')+'">'+fc(margin)+'</div><div style="font-size:11px;color:var(--muted);margin-top:4px">'+(marginPct?marginPct+'% margin':'')+'</div></div><div class="payroll-card"><div class="payroll-label">Tips + Gratuity</div><div class="payroll-val" style="color:var(--teal)">'+(w.tips!=null&&w.gratuity!=null?fc(w.tips+w.gratuity):fc(w.tips))+'</div><div style="font-size:11px;color:var(--muted);margin-top:4px">'+(w.gratuity!=null&&w.gratuity>0?fc(w.gratuity)+' gratuity':'')+'</div></div></div>'
    +'</div>';

  if(w.fh!=null && w.toast!=null){
    revenueChart = new Chart(document.getElementById('revenueChart'),{type:'doughnut',data:{labels:['FareHarbor','Toast'],datasets:[{data:[w.fh,w.toast],backgroundColor:['#FF1D8E','#00A9B5'],borderColor:'#18181d',borderWidth:3,hoverOffset:6}]},options:{responsive:true,maintainAspectRatio:false,cutout:'70%',plugins:{legend:{display:false},tooltip:{callbacks:{label:function(ctx){return ' $'+ctx.parsed.toLocaleString('en-US',{minimumFractionDigits:2});}}}}}});
  }
  if(w.tips!=null || w.gratuity!=null){
    tipChart = new Chart(document.getElementById('tipChart'),{type:'bar',data:{labels:['Tips','Gratuity'],datasets:[{data:[w.tips||0,w.gratuity||0],backgroundColor:['rgba(255,29,142,0.7)','rgba(91,63,166,0.7)'],borderColor:['#FF1D8E','#5B3FA6'],borderWidth:1.5,borderRadius:6}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:function(ctx){return ' $'+ctx.parsed.y.toLocaleString('en-US',{minimumFractionDigits:2});}}}},scales:{x:{ticks:{color:'#888',font:{size:11}},grid:{display:false}},y:{ticks:{color:'#888',font:{size:11},callback:function(v){return '$'+v.toLocaleString();}},grid:{color:'rgba(255,255,255,0.04)'}}}}});
  }
}

function buildTabs() {
  var nav = document.getElementById('weekTabs');
  nav.innerHTML = '';
  for(var i=0;i<WEEKS.length;i++){
    (function(idx){
      var btn = document.createElement('button');
      btn.className = 'tab'+(idx===WEEKS.length-1?' active':'');
      btn.textContent = WEEKS[idx].label;
      btn.onclick = function(){
        var tabs = document.querySelectorAll('.tab');
        for(var j=0;j<tabs.length;j++) tabs[j].classList.remove('active');
        btn.classList.add('active');
        render(idx);
      };
      nav.appendChild(btn);
    })(i);
  }
}

buildTabs();
render(WEEKS.length-1);
</script>
</body>
</html>
