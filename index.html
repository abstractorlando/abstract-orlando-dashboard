<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Abstract Orlando — Weekly Performance</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
  :root {
    --pink:#FF1D8E; --teal:#00A9B5; --purple:#5B3FA6;
    --black:#0a0a0a; --card:#18181d; --border:rgba(255,255,255,0.07);
    --text:#f0f0f0; --muted:#888; --green:#00C896; --red:#FF4D6A; --amber:#FFB800;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--black); color:var(--text); font-family:'DM Sans',sans-serif; font-size:14px; min-height:100vh; }
  body::before { content:''; position:fixed; top:-40%; left:-20%; width:600px; height:600px; background:radial-gradient(circle,rgba(255,29,142,0.08) 0%,transparent 70%); pointer-events:none; animation:drift 12s ease-in-out infinite alternate; }
  body::after { content:''; position:fixed; bottom:-20%; right:-10%; width:500px; height:500px; background:radial-gradient(circle,rgba(0,169,181,0.07) 0%,transparent 70%); pointer-events:none; animation:drift2 15s ease-in-out infinite alternate; }
  @keyframes drift { from{transform:translate(0,0)} to{transform:translate(40px,30px)} }
  @keyframes drift2 { from{transform:translate(0,0)} to{transform:translate(-30px,-40px)} }

  header { padding:2.5rem 2rem 1.5rem; display:flex; align-items:flex-end; justify-content:space-between; border-bottom:1px solid var(--border); position:relative; z-index:1; }
  .logo-title { font-family:'DM Serif Display',serif; font-size:1.6rem; background:linear-gradient(90deg,var(--pink),var(--teal)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
  .logo-sub { font-size:11px; color:var(--muted); letter-spacing:0.15em; text-transform:uppercase; margin-top:3px; }
  .last-updated { font-size:11px; color:var(--muted); text-align:right; }
  .live-dot { display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--green); margin-right:5px; animation:pulse 2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

  .week-tabs { display:flex; gap:6px; flex-wrap:wrap; padding:1.25rem 2rem; border-bottom:1px solid var(--border); position:relative; z-index:1; }
  .tab { padding:6px 14px; border-radius:999px; border:1px solid var(--border); background:transparent; color:var(--muted); font-family:'DM Sans',sans-serif; font-size:12px; cursor:pointer; transition:all 0.2s; }
  .tab:hover { border-color:rgba(255,29,142,0.4); color:var(--text); }
  .tab.active { background:linear-gradient(135deg,var(--pink),var(--purple)); border-color:transparent; color:#fff; font-weight:500; }

  main { padding:1.5rem 2rem 3rem; position:relative; z-index:1; }

  .kpi-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:12px; margin-bottom:1.5rem; }
  .kpi { background:var(--card); border:1px solid var(--border); border-radius:16px; padding:1.25rem 1.5rem; position:relative; overflow:hidden; transition:transform 0.2s; }
  .kpi:hover { transform:translateY(-2px); }
  .kpi::before { content:''; position:absolute; top:0; left:0; right:0; height:2px; }
  .kpi.good::before { background:linear-gradient(90deg,var(--green),var(--teal)); }
  .kpi.bad::before { background:linear-gradient(90deg,var(--red),#ff8c00); }
  .kpi.neutral::before { background:linear-gradient(90deg,var(--purple),var(--teal)); }
  .kpi.warn::before { background:linear-gradient(90deg,var(--amber),var(--pink)); }
  .kpi-label { font-size:10px; text-transform:uppercase; letter-spacing:0.12em; color:var(--muted); margin-bottom:8px; }
  .kpi-value { font-family:'DM Serif Display',serif; font-size:1.9rem; line-height:1; margin-bottom:6px; }
  .kpi.good .kpi-value { color:var(--green); }
  .kpi.bad .kpi-value { color:var(--red); }
  .kpi.neutral .kpi-value { color:var(--text); }
  .kpi.warn .kpi-value { color:var(--amber); }
  .kpi-target { font-size:11px; color:var(--muted); }
  .kpi-badge { display:inline-block; font-size:10px; padding:2px 8px; border-radius:999px; margin-left:6px; font-weight:500; }
  .badge-good { background:rgba(0,200,150,0.15); color:var(--green); }
  .badge-bad { background:rgba(255,77,106,0.15); color:var(--red); }
  .badge-warn { background:rgba(255,184,0,0.15); color:var(--amber); }

  .section-title { font-family:'DM Serif Display',serif; font-size:1rem; color:var(--muted); margin:2rem 0 0.75rem; display:flex; align-items:center; gap:10px; }
  .section-title::after { content:''; flex:1; height:1px; background:var(--border); }
  .dot { width:6px; height:6px; border-radius:50%; display:inline-block; }
  .dot-pink { background:var(--pink); } .dot-teal { background:var(--teal); } .dot-purple { background:var(--purple); }

  .promo-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:10px; }
  .promo-card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:1rem; display:flex; flex-direction:column; gap:6px; transition:transform 0.2s; }
  .promo-card:hover { transform:translateY(-2px); }
  .promo-name { font-size:10px; text-transform:uppercase; letter-spacing:0.1em; color:var(--muted); }
  .promo-val { font-family:'DM Serif Display',serif; font-size:1.5rem; color:var(--text); }
  .promo-target { font-size:10px; color:var(--muted); }

  .charts-grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-top:0.5rem; }
  @media(max-width:800px) { .charts-grid { grid-template-columns:1fr; } }
  .chart-card { background:var(--card); border:1px solid var(--border); border-radius:16px; padding:1.25rem 1.5rem; }
  .chart-title { font-size:11px; text-transform:uppercase; letter-spacing:0.1em; color:var(--muted); margin-bottom:1rem; }

  .guest-row { display:flex; gap:10px; margin-top:0.5rem; }
  .guest-pill { flex:1; background:var(--card); border:1px solid var(--border); border-radius:12px; padding:1rem; text-align:center; }
  .guest-pill-label { font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:0.1em; margin-bottom:6px; }
  .guest-pill-val { font-family:'DM Serif Display',serif; font-size:1.6rem; }

  .progress-wrap { margin-top:0.5rem; }
  .progress-label { display:flex; justify-content:space-between; font-size:11px; color:var(--muted); margin-bottom:4px; }
  .progress-bar { height:6px; background:rgba(255,255,255,0.06); border-radius:999px; overflow:hidden; }
  .progress-fill { height:100%; border-radius:999px; transition:width 0.6s ease; }
  .fill-good { background:linear-gradient(90deg,var(--teal),var(--green)); }
  .fill-bad { background:linear-gradient(90deg,var(--red),#ff6b35); }
  .fill-warn { background:linear-gradient(90deg,var(--amber),var(--pink)); }

  .payroll-row { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:0.5rem; }
  .payroll-card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:1rem 1.25rem; }
  .payroll-label { font-size:10px; text-transform:uppercase; letter-spacing:0.1em; color:var(--muted); margin-bottom:6px; }
  .payroll-val { font-family:'DM Serif Display',serif; font-size:1.4rem; }

  .loading { display:flex; flex-direction:column; align-items:center; justify-content:center; height:60vh; gap:16px; }
  .spinner { width:40px; height:40px; border:2px solid var(--border); border-top-color:var(--pink); border-radius:50%; animation:spin 0.8s linear infinite; }
  @keyframes spin { to{transform:rotate(360deg)} }
  .error-box { background:rgba(255,77,106,0.1); border:1px solid rgba(255,77,106,0.3); border-radius:12px; padding:1.5rem 2rem; text-align:center; max-width:500px; margin:2rem auto; }

  .fade-in { animation:fadeIn 0.4s ease; }
  @keyframes fadeIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
  .no-data { color:var(--muted); font-size:12px; font-style:italic; }
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-title">Abstract Orlando</div>
    <div class="logo-sub">Weekly Performance Dashboard</div>
  </div>
  <div class="last-updated"><span class="live-dot"></span>Live from Google Sheets<br><span id="lastFetch" style="color:var(--muted);font-size:10px;"></span></div>
</header>

<div class="week-tabs" id="weekTabs"></div>
<main id="main">
  <div class="loading"><div class="spinner"></div><div style="color:var(--muted);font-size:13px;">Loading your data...</div></div>
</main>

<script>
const CSV_URL = 'https://script.google.com/macros/s/AKfycbyvuyYDOJtUYHcAMZXGgThMAYpzpScyvsCi1yxEpH-ZpwJqaZl3GfoyTVeNIRQ5EI4/exec';

const TARGETS = {
  'FareHarbor Revenue': 5000,
  'Toast Revenue': 15000,
  'Total Revenue': 20000,
  'Tips': 2250,
  'Tip %': 15,
  'Gratuity': 1000,
  'B3G1F': 10,
  'Additional Project': 20,
  'Tapas Upsell': 30,
  'Reviews': 20
};

// Section header rows to skip
const SECTION_HEADERS = ['REVENUE','TIPS & GRATUITY','PROMOTIONS','GUESTS & OPERATIONS'];

let revenueChart, tipChart;
let allWeeks = [];

function parseCSV(text) {
  const lines = text.trim().split('\n').map(l => {
    const cols = [];
    let cur = '', inQ = false;
    for (let i = 0; i < l.length; i++) {
      if (l[i] === '"') { inQ = !inQ; }
      else if (l[i] === ',' && !inQ) { cols.push(cur.trim()); cur = ''; }
      else cur += l[i];
    }
    cols.push(cur.trim());
    return cols;
  });
  return lines;
}

function cleanNum(v) {
  if (!v || v === '' || v === 'N/A' || v === 'NA' || v === '-') return null;
  const n = parseFloat(v.replace(/[$,%]/g,''));
  return isNaN(n) ? null : n;
}

function buildWeeks(rows) {
  const header = rows[0];
  const weekLabels = header.slice(2).filter(w => w && w.trim() !== '';
  const weeks = weekLabels.map((label, wi) => {
    const colIdx = wi + 2;
    const w = { label: label.trim() };
    rows.slice(1).forEach(row => {
      const metric = (row[0] || '').trim();
      if (!metric || SECTION_HEADERS.includes(metric)) return;
      w[metric] = cleanNum(row[colIdx]);
    });
    return w;
  });
  // Only return weeks that have at least one data point
  return weeks.filter(w => Object.values(w).some((v,i) => i > 0 && v !== null));
}

function $c(n) { return n == null ? '—' : '$' + n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function $n(n) { return n == null ? '—' : n; }
function pct(a,b) { return b ? Math.min(Math.round((a/b)*100), 100) : 0; }
function cls(val, target) { if(val==null||target==null) return 'neutral'; return val >= target ? 'good' : val >= target*0.8 ? 'warn' : 'bad'; }
function fillCls(val, target) { if(val==null||target==null) return 'fill-warn'; return val >= target ? 'fill-good' : val >= target*0.8 ? 'fill-warn' : 'fill-bad'; }

function destroyCharts() {
  if(revenueChart){revenueChart.destroy();revenueChart=null;}
  if(tipChart){tipChart.destroy();tipChart=null;}
}

function render(idx) {
  destroyCharts();
  const w = allWeeks[idx];
  const total = w['Total Revenue'];
  const fh = w['FareHarbor Revenue'];
  const toast = w['Toast Revenue'];
  const tips = w['Tips'];
  const tipPct = w['Tip %'];
  const gratuity = w['Gratuity'];
  const reviews = w['Reviews'];
  const payroll = w['Payroll'];
  const ft = w['First Time (FT)'];
  const rg = w['Returning (RG)'];
  const guests = w['Total Guests'];
  const pickups = w['Pickups'];
  const margin = (total != null && payroll != null) ? total - payroll : null;
  const marginPct = margin != null && total ? ((margin/total)*100).toFixed(1) : null;

  const revCls = cls(total, TARGETS['Total Revenue']);
  const tipCls = cls(tipPct, TARGETS['Tip %']);
  const revBadge = total == null ? '' : total >= TARGETS['Total Revenue']
    ? `<span class="kpi-badge badge-good">✓ Target hit</span>`
    : `<span class="kpi-badge badge-bad">↓ ${$c(TARGETS['Total Revenue']-total)} short</span>`;
  const tipBadge = tipPct == null ? '' : tipPct >= TARGETS['Tip %']
    ? `<span class="kpi-badge badge-good">✓ On target</span>`
    : `<span class="kpi-badge badge-warn">↓ Below 15%</span>`;
  const revBadgeCls = cls(reviews, TARGETS['Reviews']);
  const reviewBadge = reviews == null ? '' : reviews >= TARGETS['Reviews']
    ? `<span class="kpi-badge badge-good">✓ Met</span>`
    : `<span class="kpi-badge badge-bad">Need ${TARGETS['Reviews']-reviews} more</span>`;

  const promos = [
    { name:'B3G1F', val:w['B3G1F'], target:TARGETS['B3G1F'] },
    { name:"Add'l Project", val:w['Additional Project'], target:TARGETS['Additional Project'] },
    { name:'Tapas Upsell', val:w['Tapas Upsell'], target:TARGETS['Tapas Upsell'] },
    { name:'BDAYGIFT', val:w['BDAYGIFT'], target:null, color:'var(--pink)' },
    { name:'FIRST50', val:w['FIRST50'], target:null, color:'var(--teal)' },
    { name:'Thank You', val:w['Thank You Vouchers'], target:null },
    { name:'Groupon $20', val:w['Groupon Voucher $20 OFF'], target:null, color:'var(--amber)' },
    { name:'Groupon Labubu', val:w['Groupon Voucher Labubu'], target:null },
    { name:'Golden Ticket Used', val:w['Golden Ticket Used'], target:null, color:'var(--amber)' },
    { name:'Golden Ticket Issued', val:w['Golden Ticket Issued'], target:null },
  ];

  function promoColor(p) {
    if (p.color) return p.color;
    if (p.target == null) return 'var(--text)';
    if (p.val == null) return 'var(--muted)';
    return p.val >= p.target ? 'var(--green)' : 'var(--red)';
  }

  document.getElementById('main').innerHTML = `
  <div class="fade-in">
  <div class="kpi-row">
    <div class="kpi ${revCls}">
      <div class="kpi-label">Total Revenue</div>
      <div class="kpi-value">${$c(total)}</div>
      <div class="kpi-target">Target ${$c(TARGETS['Total Revenue'])} ${revBadge}</div>
      ${total!=null?`<div class="progress-wrap" style="margin-top:10px"><div class="progress-bar"><div class="progress-fill ${fillCls(total,TARGETS['Total Revenue'])}" style="width:${pct(total,TARGETS['Total Revenue'])}%"></div></div></div>`:''}
    </div>
    <div class="kpi neutral">
      <div class="kpi-label">FareHarbor</div>
      <div class="kpi-value">${$c(fh)}</div>
      <div class="kpi-target">${total&&fh?pct(fh,total)+'% of total · ':''} target ${$c(TARGETS['FareHarbor Revenue'])}</div>
    </div>
    <div class="kpi neutral">
      <div class="kpi-label">Toast (In-Studio)</div>
      <div class="kpi-value">${$c(toast)}</div>
      <div class="kpi-target">${total&&toast?pct(toast,total)+'% of total · ':''} target ${$c(TARGETS['Toast Revenue'])}</div>
    </div>
    <div class="kpi ${tipCls}">
      <div class="kpi-label">Tip Rate</div>
      <div class="kpi-value">${tipPct!=null?tipPct.toFixed(1)+'%':'—'}</div>
      <div class="kpi-target">Target 15% ${tipBadge}</div>
    </div>
    <div class="kpi ${revBadgeCls}">
      <div class="kpi-label">Reviews</div>
      <div class="kpi-value">${$n(reviews)}</div>
      <div class="kpi-target">Target ${TARGETS['Reviews']} ${reviewBadge}</div>
      ${reviews!=null?`<div class="progress-wrap" style="margin-top:10px"><div class="progress-bar"><div class="progress-fill ${fillCls(reviews,TARGETS['Reviews'])}" style="width:${pct(reviews,TARGETS['Reviews'])}%"></div></div></div>`:''}
    </div>
  </div>

  <div class="section-title"><span class="dot dot-pink"></span> Revenue Breakdown</div>
  <div class="charts-grid">
    <div class="chart-card">
      <div class="chart-title">Revenue split</div>
      <div style="position:relative;height:200px"><canvas id="revenueChart" role="img" aria-label="Revenue split">FareHarbor: ${$c(fh)}, Toast: ${$c(toast)}</canvas></div>
    </div>
    <div class="chart-card">
      <div class="chart-title">Tips & gratuity</div>
      <div style="position:relative;height:200px"><canvas id="tipChart" role="img" aria-label="Tips and gratuity">Tips: ${$c(tips)}, Gratuity: ${$c(gratuity)}</canvas></div>
    </div>
  </div>

  <div class="section-title"><span class="dot dot-teal"></span> Guests</div>
  <div class="guest-row">
    <div class="guest-pill"><div class="guest-pill-label">First Time</div><div class="guest-pill-val" style="color:var(--pink)">${$n(ft)}</div></div>
    <div class="guest-pill"><div class="guest-pill-label">Returning</div><div class="guest-pill-val" style="color:var(--teal)">${$n(rg)}</div></div>
    <div class="guest-pill"><div class="guest-pill-label">Total Guests</div><div class="guest-pill-val">${$n(guests)}</div></div>
    <div class="guest-pill"><div class="guest-pill-label">Pickups</div><div class="guest-pill-val" style="color:var(--purple)">${$n(pickups)}</div></div>
  </div>

  <div class="section-title"><span class="dot dot-purple"></span> Promotions</div>
  <div class="promo-grid">
    ${promos.map(p=>`
    <div class="promo-card">
      <div class="promo-name">${p.name}</div>
      <div class="promo-val" style="color:${promoColor(p)}">${$n(p.val)}</div>
      <div class="promo-target">${p.target!=null?'Target '+p.target:''}</div>
    </div>`).join('')}
  </div>

  <div class="section-title"><span class="dot dot-pink"></span> Payroll & Margin</div>
  <div class="payroll-row">
    <div class="payroll-card">
      <div class="payroll-label">Payroll</div>
      <div class="payroll-val" style="color:var(--red)">${$c(payroll)}</div>
      <div style="font-size:11px;color:var(--muted);margin-top:4px">${total&&payroll?pct(payroll,total)+'% of revenue':''}</div>
    </div>
    <div class="payroll-card">
      <div class="payroll-label">Gross Margin</div>
      <div class="payroll-val" style="color:${margin!=null&&margin>0?'var(--green)':'var(--red)'}">${$c(margin)}</div>
      <div style="font-size:11px;color:var(--muted);margin-top:4px">${marginPct?marginPct+'% margin':''}</div>
    </div>
    <div class="payroll-card">
      <div class="payroll-label">Tips + Gratuity</div>
      <div class="payroll-val" style="color:var(--teal)">${tips!=null&&gratuity!=null?$c(tips+gratuity):$c(tips)}</div>
      <div style="font-size:11px;color:var(--muted);margin-top:4px">${gratuity!=null?$c(gratuity)+' gratuity':''}</div>
    </div>
  </div>
  </div>`;

  // Charts
  if (fh != null && toast != null) {
    revenueChart = new Chart(document.getElementById('revenueChart'), {
      type:'doughnut',
      data:{ labels:['FareHarbor','Toast'], datasets:[{ data:[fh,toast], backgroundColor:['#FF1D8E','#00A9B5'], borderColor:'#18181d', borderWidth:3, hoverOffset:6 }] },
      options:{ responsive:true, maintainAspectRatio:false, cutout:'70%', plugins:{ legend:{display:false}, tooltip:{callbacks:{label:ctx=>' $'+ctx.parsed.toLocaleString('en-US',{minimumFractionDigits:2})}} } }
    });
  }
  if (tips != null || gratuity != null) {
    tipChart = new Chart(document.getElementById('tipChart'), {
      type:'bar',
      data:{ labels:['Tips','Gratuity'], datasets:[{ data:[tips||0,gratuity||0], backgroundColor:['rgba(255,29,142,0.7)','rgba(91,63,166,0.7)'], borderColor:['#FF1D8E','#5B3FA6'], borderWidth:1.5, borderRadius:6 }] },
      options:{ responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false},tooltip:{callbacks:{label:ctx=>' $'+ctx.parsed.y.toLocaleString('en-US',{minimumFractionDigits:2})}}}, scales:{ x:{ticks:{color:'#888',font:{size:11}},grid:{display:false}}, y:{ticks:{color:'#888',font:{size:11},callback:v=>'$'+v.toLocaleString()},grid:{color:'rgba(255,255,255,0.04)'}} } }
    });
  }
}

function buildTabs() {
  const nav = document.getElementById('weekTabs';
  nav.innerHTML = '';
  allWeeks.forEach((w,i) => {
    const btn = document.createElement('button';
    btn.className = 'tab' + (i===allWeeks.length-1?' active':'';
    btn.textContent = w.label;
    btn.onclick = () => {
      document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active';
      render(i);
    };
    nav.appendChild(btn);
  });
}

async function loadData() {
  try {
    const res = await fetch(CSV_URL);
    if (!res.ok) throw new Error('Fetch failed');
    const text = await res.text();
    const rows = parseCSV(text);
    allWeeks = buildWeeks(rows);
    if (!allWeeks.length) throw new Error('No data found');
    document.getElementById('lastFetch').textContent = 'Last loaded: ' + new Date().toLocaleTimeString();
    buildTabs();
    render(allWeeks.length - 1); // show most recent week
  } catch(e) {
    document.getElementById('main').innerHTML = `
      <div class="error-box">
        <div style="font-size:1.5rem;margin-bottom:8px">⚠️</div>
        <div style="font-weight:500;margin-bottom:6px">Could not load sheet data</div>
        <div style="color:var(--muted);font-size:12px">Make sure the Google Sheet is published to web as CSV and your internet is connected.</div>
      </div>`;
  }
}

loadData();
// Auto-refresh every 5 minutes
setInterval(loadData, 5 * 60 * 1000);
</script>
</body>
</html>
