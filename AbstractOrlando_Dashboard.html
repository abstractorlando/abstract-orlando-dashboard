<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Abstract Orlando — Weekly Performance</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
  :root { --pink:#FF1D8E; --teal:#00A9B5; --purple:#5B3FA6; --black:#0a0a0a; --card:#18181d; --border:rgba(255,255,255,0.07); --text:#f0f0f0; --muted:#888; --green:#00C896; --red:#FF4D6A; --amber:#FFB800; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--black); color:var(--text); font-family:'DM Sans',sans-serif; font-size:14px; min-height:100vh; }
  body::before { content:''; position:fixed; top:-40%; left:-20%; width:600px; height:600px; background:radial-gradient(circle,rgba(255,29,142,0.08) 0%,transparent 70%); pointer-events:none; animation:drift 12s ease-in-out infinite alternate; }
  body::after { content:''; position:fixed; bottom:-20%; right:-10%; width:500px; height:500px; background:radial-gradient(circle,rgba(0,169,181,0.07) 0%,transparent 70%); pointer-events:none; animation:drift2 15s ease-in-out infinite alternate; }
  @keyframes drift { from{transform:translate(0,0)} to{transform:translate(40px,30px)} }
  @keyframes drift2 { from{transform:translate(0,0)} to{transform:translate(-30px,-40px)} }
  header { padding:2.5rem 2rem 1.5rem; display:flex; align-items:flex-end; justify-content:space-between; border-bottom:1px solid var(--border); position:relative; z-index:1; }
  .logo-title { font-family:'DM Serif Display',serif; font-size:1.6rem; background:linear-gradient(90deg,var(--pink),var(--teal)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
  .logo-sub { font-size:11px; color:var(--muted); letter-spacing:0.15em; text-transform:uppercase; margin-top:3px; }
  .header-right { text-align:right; font-size:11px; color:var(--muted); }
  .week-tabs { display:flex; gap:6px; flex-wrap:wrap; padding:1.25rem 2rem; border-bottom:1px solid var(--border); position:relative; z-index:1; }
  .tab { padding:6px 14px; border-radius:999px; border:1px solid var(--border); background:transparent; color:var(--muted); font-family:'DM Sans',sans-serif; font-size:12px; cursor:pointer; transition:all 0.2s; }
  .tab:hover { border-color:rgba(255,29,142,0.4); color:var(--text); }
  .tab.active { background:linear-gradient(135deg,var(--pink),var(--purple)); border-color:transparent; color:#fff; font-weight:500; }
  main { padding:1.5rem 2rem 3rem; position:relative; z-index:1; }
  .kpi-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:12px; margin-bottom:1.5rem; }
  .kpi { background:var(--card); border:1px solid var(--border); border-radius:16px; padding:1.25rem 1.5rem; position:relative; overflow:hidden; transition:transform 0.2s; }
  .kpi:hover { transform:translateY(-2px); }
  .kpi::before { content:''; position:absolute; top:0; left:0; right:0; height:2px; }
  .kpi.good::before { background:linear-gradient(90deg,var(--green),var(--teal)); }
  .kpi.bad::before { background:linear-gradient(90deg,var(--red),#ff8c00); }
  .kpi.neutral::before { background:linear-gradient(90deg,var(--purple),var(--teal)); }
  .kpi.warn::before { background:linear-gradient(90deg,var(--amber),var(--pink)); }
  .kpi-label { font-size:10px; text-transform:uppercase; letter-spacing:0.12em; color:var(--muted); margin-bottom:8px; }
  .kpi-value { font-family:'DM Serif Display',serif; font-size:1.9rem; line-height:1; margin-bottom:6px; }
  .kpi.good .kpi-value { color:var(--green); } .kpi.bad .kpi-value { color:var(--red); } .kpi.neutral .kpi-value { color:var(--text); } .kpi.warn .kpi-value { color:var(--amber); }
  .kpi-target { font-size:11px; color:var(--muted); }
  .kpi-badge { display:inline-block; font-size:10px; padding:2px 8px; border-radius:999px; margin-left:6px; font-weight:500; }
  .badge-good { background:rgba(0,200,150,0.15); color:var(--green); } .badge-bad { background:rgba(255,77,106,0.15); color:var(--red); } .badge-warn { background:rgba(255,184,0,0.15); color:var(--amber); }
  .section-title { font-family:'DM Serif Display',serif; font-size:1rem; color:var(--muted); margin:2rem 0 0.75rem; display:flex; align-items:center; gap:10px; }
  .section-title::after { content:''; flex:1; height:1px; background:var(--border); }
  .dot { width:6px; height:6px; border-radius:50%; display:inline-block; }
  .dot-pink{background:var(--pink);} .dot-teal{background:var(--teal);} .dot-purple{background:var(--purple);}
  .promo-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:10px; }
  .promo-card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:1rem; display:flex; flex-direction:column; gap:6px; transition:transform 0.2s; }
  .promo-card:hover { transform:translateY(-2px); }
  .promo-name { font-size:10px; text-transform:uppercase; letter-spacing:0.1em; color:var(--muted); }
  .promo-val { font-family:'DM Serif Display',serif; font-size:1.5rem; }
  .promo-target { font-size:10px; color:var(--muted); }
  .charts-grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-top:0.5rem; }
  @media(max-width:800px){.charts-grid{grid-template-columns:1fr;}}
  .chart-card { background:var(--card); border:1px solid var(--border); border-radius:16px; padding:1.25rem 1.5rem; }
  .chart-title { font-size:11px; text-transform:uppercase; letter-spacing:0.1em; color:var(--muted); margin-bottom:1rem; }
  .guest-row { display:flex; gap:10px; margin-top:0.5rem; flex-wrap:wrap; }
  .guest-pill { flex:1; min-width:100px; background:var(--card); border:1px solid var(--border); border-radius:12px; padding:1rem; text-align:center; }
  .guest-pill-label { font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:0.1em; margin-bottom:6px; }
  .guest-pill-val { font-family:'DM Serif Display',serif; font-size:1.6rem; }
  .progress-wrap { margin-top:0.5rem; }
  .progress-bar { height:6px; background:rgba(255,255,255,0.06); border-radius:999px; overflow:hidden; }
  .progress-fill { height:100%; border-radius:999px; transition:width 0.6s ease; }
  .fill-good{background:linear-gradient(90deg,var(--teal),var(--green));} .fill-bad{background:linear-gradient(90deg,var(--red),#ff6b35);} .fill-warn{background:linear-gradient(90deg,var(--amber),var(--pink));}
  .payroll-row { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:0.5rem; }
  .payroll-card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:1rem 1.25rem; }
  .payroll-label { font-size:10px; text-transform:uppercase; letter-spacing:0.1em; color:var(--muted); margin-bottom:6px; }
  .payroll-val { font-family:'DM Serif Display',serif; font-size:1.4rem; }
  .fade-in { animation:fadeIn 0.4s ease; }
  @keyframes fadeIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
</style>
</head>
<body>
<header>
  <div class="logo">
    <div class="logo-title">Abstract Orlando</div>
    <div class="logo-sub">Weekly Performance Dashboard</div>
  </div>
  <div class="header-right">Updated weekly<br><span style="color:var(--pink);font-size:10px;">abstractorlando.com</span></div>
</header>
<div class="week-tabs" id="weekTabs"></div>
<main id="main"></main>
<script>
var WEEKS = [
  { label:"Apr 13-19", fh:3161.37, toast:8181.21, total:11342.58, tips:1507.01, tipPct:18.42, gratuity:510.84, b3g1:1, addtl:7, tapas:0, bday:2, first50:0, datenight:null, thankyou:1, groupon20:2, grouponLab:null, goldenUsed:1, goldenIssued:1, ft:61, rg:29, guests:90, pickups:40, reviews:7, payroll:6874.74 },
  { label:"Apr 20-26", fh:3566.54, toast:11323.35, total:14889.89, tips:1562.30, tipPct:13.80, gratuity:505.26, b3g1:3, addtl:8, tapas:1, bday:0, first50:0, datenight:null, thankyou:0, groupon20:5, grouponLab:null, goldenUsed:3, goldenIssued:2, ft:111, rg:32, guests:143, pickups:31, reviews:21, payroll:7326.92 },
  { label:"Apr 30-May 3", fh:3394.62, toast:8355.00, total:11749.62, tips:1157.05, tipPct:13.85, gratuity:93.60, b3g1:0, addtl:12, tapas:0, bday:2, first50:0, datenight:null, thankyou:2, groupon20:6, grouponLab:null, goldenUsed:5, goldenIssued:2, ft:65, rg:28, guests:93, pickups:41, reviews:14, payroll:7465.05 },
  { label:"May 7-10", fh:1457.68, toast:18096.50, total:19554.18, tips:2164.05, tipPct:11.96, gratuity:278.10, b3g1:3, addtl:2, tapas:null, bday:2, first50:0, datenight:null, thankyou:0, groupon20:6, grouponLab:0, goldenUsed:6, goldenIssued:2, ft:105, rg:70, guests:175, pickups:27, reviews:15, payroll:8837.07 },
  { label:"May 14-17", fh:4060.91, toast:10002.74, total:14063.65, tips:1323.00, tipPct:13.23, gratuity:127.80, b3g1:0, addtl:4, tapas:2, bday:2, first50:2, datenight:null, thankyou:0, groupon20:1, grouponLab:0, goldenUsed:2, goldenIssued:2, ft:86, rg:31, guests:117, pickups:51, reviews:17, payroll:8679.50 },
  { label:"May 21-24", fh:3401.87, toast:10915.83, total:14317.70, tips:1600.51, tipPct:14.66, gratuity:389.70, b3g1:null, addtl:7, tapas:1, bday:6, first50:2, datenight:1, thankyou:0, groupon20:0, grouponLab:2, goldenUsed:3, goldenIssued:1, ft:82, rg:47, guests:129, pickups:38, reviews:41, payroll:8376.37 },
  { label:"May 28-31", fh:3474.34, toast:14149.51, total:17623.85, tips:1321.84, tipPct:9.34, gratuity:826.20, b3g1:null, addtl:6, tapas:4, bday:7, first50:12, datenight:3, thankyou:0, groupon20:7, grouponLab:0, goldenUsed:0, goldenIssued:2, ft:124, rg:34, guests:158, pickups:null, reviews:29, payroll:9724.42 },
  { label:"Jun 4-7", fh:4774.04, toast:14251.93, total:19025.97, tips:1704.64, tipPct:11.96, gratuity:0, b3g1:null, addtl:16, tapas:3, bday:2, first50:3, datenight:4, thankyou:0, groupon20:0, grouponLab:2, goldenUsed:2, goldenIssued:2, ft:128, rg:40, guests:168, pickups:57, reviews:25, payroll:8715.45 }
];

var T = { total:20000, fh:5000, toast:15000, tips:2250, tipPct:15, gratuity:1000, b3g1:10, addtl:20, tapas:30, reviews:20 };
var revenueChart, tipChart;

function fc(n) { return n==null ? '—' : '$'+n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function fn(n) { return n==null ? '—' : n; }
function pp(a,b) { return b ? Math.min(Math.round((a/b)*100),100) : 0; }
function gc(v,t) { if(v==null||t==null) return 'neutral'; return v>=t ? 'good' : v>=t*0.8 ? 'warn' : 'bad'; }
function gf(v,t) { if(v==null||t==null) return 'fill-warn'; return v>=t ? 'fill-good' : v>=t*0.8 ? 'fill-warn' : 'fill-bad'; }

function destroyCharts() {
  if(revenueChart){ revenueChart.destroy(); revenueChart=null; }
  if(tipChart){ tipChart.destroy(); tipChart=null; }
}

function render(idx) {
  destroyCharts();
  var w = WEEKS[idx];
  var margin = (w.total!=null && w.payroll!=null) ? w.total-w.payroll : null;
  var marginPct = (margin!=null && w.total) ? ((margin/w.total)*100).toFixed(1) : null;

  var promos = [
    {name:'B3G1F', val:w.b3g1, target:T.b3g1},
    {name:"Add'l Project", val:w.addtl, target:T.addtl},
    {name:'Tapas Upsell', val:w.tapas, target:T.tapas},
    {name:'BDAYGIFT', val:w.bday, target:null, color:'var(--pink)'},
    {name:'FIRST50', val:w.first50, target:null, color:'var(--teal)'},
    {name:'Date Night', val:w.datenight, target:null, color:'var(--purple)'},
    {name:'Thank You', val:w.thankyou, target:null},
    {name:'Groupon $20', val:w.groupon20, target:null, color:'var(--amber)'},
    {name:'Groupon Labubu', val:w.grouponLab, target:null},
    {name:'Golden Ticket Used', val:w.goldenUsed, target:null, color:'var(--amber)'},
    {name:'Golden Ticket Issued', val:w.goldenIssued, target:null}
  ];

  function pc(p) {
    if(p.color) return p.color;
    if(p.target==null) return 'var(--text)';
    if(p.val==null) return 'var(--muted)';
    return p.val>=p.target ? 'var(--green)' : 'var(--red)';
  }

  var promoHTML = '';
  for(var i=0;i<promos.length;i++){
    var p=promos[i];
    promoHTML += '<div class="promo-card"><div class="promo-name">'+p.name+'</div><div class="promo-val" style="color:'+pc(p)+'">'+fn(p.val)+'</div><div class="promo-target">'+(p.target!=null?'Target '+p.target:'')+'</div></div>';
  }

  var revBadge = w.total>=T.total ? '<span class="kpi-badge badge-good">&#10003; Hit</span>' : '<span class="kpi-badge badge-bad">&#8595; $'+Math.round(T.total-w.total).toLocaleString()+' short</span>';
  var tipBadge = w.tipPct!=null ? (w.tipPct>=T.tipPct ? '<span class="kpi-badge badge-good">&#10003; On target</span>' : '<span class="kpi-badge badge-warn">&#8595; Below 15%</span>') : '';
  var revBadge2 = w.reviews!=null ? (w.reviews>=T.reviews ? '<span class="kpi-badge badge-good">&#10003; Met</span>' : '<span class="kpi-badge badge-bad">Need '+(T.reviews-w.reviews)+' more</span>') : '';

  document.getElementById('main').innerHTML = '<div class="fade-in">'
    +'<div class="kpi-row">'
    +'<div class="kpi '+gc(w.total,T.total)+'"><div class="kpi-label">Total Revenue</div><div class="kpi-value">'+fc(w.total)+'</div><div class="kpi-target">Target '+fc(T.total)+' '+revBadge+'</div><div class="progress-wrap"><div class="progress-bar"><div class="progress-fill '+gf(w.total,T.total)+'" style="width:'+pp(w.total,T.total)+'%"></div></div></div></div>'
    +'<div class="kpi neutral"><div class="kpi-label">FareHarbor</div><div class="kpi-value">'+fc(w.fh)+'</div><div class="kpi-target">'+(w.total&&w.fh?pp(w.fh,w.total)+'% of total':'')+'</div></div>'
    +'<div class="kpi neutral"><div class="kpi-label">Toast (In-Studio)</div><div class="kpi-value">'+fc(w.toast)+'</div><div class="kpi-target">'+(w.total&&w.toast?pp(w.toast,w.total)+'% of total':'')+'</div></div>'
    +'<div class="kpi '+gc(w.tipPct,T.tipPct)+'"><div class="kpi-label">Tip Rate</div><div class="kpi-value">'+(w.tipPct!=null?w.tipPct.toFixed(1)+'%':'—')+'</div><div class="kpi-target">Target 15% '+tipBadge+'</div></div>'
    +'<div class="kpi '+gc(w.reviews,T.reviews)+'"><div class="kpi-label">Reviews</div><div class="kpi-value">'+fn(w.reviews)+'</div><div class="kpi-target">Target '+T.reviews+' '+revBadge2+'</div><div class="progress-wrap"><div class="progress-bar"><div class="progress-fill '+gf(w.reviews,T.reviews)+'" style="width:'+pp(w.reviews,T.reviews)+'%"></div></div></div></div>'
    +'</div>'
    +'<div class="section-title"><span class="dot dot-pink"></span> Revenue Breakdown</div>'
    +'<div class="charts-grid"><div class="chart-card"><div class="chart-title">Revenue split</div><div style="position:relative;height:200px"><canvas id="revenueChart"></canvas></div></div><div class="chart-card"><div class="chart-title">Tips & gratuity</div><div style="position:relative;height:200px"><canvas id="tipChart"></canvas></div></div></div>'
    +'<div class="section-title"><span class="dot dot-teal"></span> Guests</div>'
    +'<div class="guest-row"><div class="guest-pill"><div class="guest-pill-label">First Time</div><div class="guest-pill-val" style="color:var(--pink)">'+fn(w.ft)+'</div></div><div class="guest-pill"><div class="guest-pill-label">Returning</div><div class="guest-pill-val" style="color:var(--teal)">'+fn(w.rg)+'</div></div><div class="guest-pill"><div class="guest-pill-label">Total Guests</div><div class="guest-pill-val">'+fn(w.guests)+'</div></div><div class="guest-pill"><div class="guest-pill-label">Pickups</div><div class="guest-pill-val" style="color:var(--purple)">'+fn(w.pickups)+'</div></div></div>'
    +'<div class="section-title"><span class="dot dot-purple"></span> Promotions</div>'
    +'<div class="promo-grid">'+promoHTML+'</div>'
    +'<div class="section-title"><span class="dot dot-pink"></span> Payroll & Margin</div>'
    +'<div class="payroll-row"><div class="payroll-card"><div class="payroll-label">Payroll</div><div class="payroll-val" style="color:var(--red)">'+fc(w.payroll)+'</div><div style="font-size:11px;color:var(--muted);margin-top:4px">'+(w.total&&w.payroll?pp(w.payroll,w.total)+'% of revenue':'')+'</div></div><div class="payroll-card"><div class="payroll-label">Gross Margin</div><div class="payroll-val" style="color:'+(margin!=null&&margin>0?'var(--green)':'var(--red)')+'">'+fc(margin)+'</div><div style="font-size:11px;color:var(--muted);margin-top:4px">'+(marginPct?marginPct+'% margin':'')+'</div></div><div class="payroll-card"><div class="payroll-label">Tips + Gratuity</div><div class="payroll-val" style="color:var(--teal)">'+(w.tips!=null&&w.gratuity!=null?fc(w.tips+w.gratuity):fc(w.tips))+'</div><div style="font-size:11px;color:var(--muted);margin-top:4px">'+(w.gratuity!=null?fc(w.gratuity)+' gratuity':'')+'</div></div></div>'
    +'</div>';

  if(w.fh!=null && w.toast!=null){
    revenueChart = new Chart(document.getElementById('revenueChart'),{type:'doughnut',data:{labels:['FareHarbor','Toast'],datasets:[{data:[w.fh,w.toast],backgroundColor:['#FF1D8E','#00A9B5'],borderColor:'#18181d',borderWidth:3,hoverOffset:6}]},options:{responsive:true,maintainAspectRatio:false,cutout:'70%',plugins:{legend:{display:false},tooltip:{callbacks:{label:function(ctx){return ' $'+ctx.parsed.toLocaleString('en-US',{minimumFractionDigits:2});}}}}}});
  }
  if(w.tips!=null || w.gratuity!=null){
    tipChart = new Chart(document.getElementById('tipChart'),{type:'bar',data:{labels:['Tips','Gratuity'],datasets:[{data:[w.tips||0,w.gratuity||0],backgroundColor:['rgba(255,29,142,0.7)','rgba(91,63,166,0.7)'],borderColor:['#FF1D8E','#5B3FA6'],borderWidth:1.5,borderRadius:6}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:function(ctx){return ' $'+ctx.parsed.y.toLocaleString('en-US',{minimumFractionDigits:2});}}}},scales:{x:{ticks:{color:'#888',font:{size:11}},grid:{display:false}},y:{ticks:{color:'#888',font:{size:11},callback:function(v){return '$'+v.toLocaleString();}},grid:{color:'rgba(255,255,255,0.04)'}}}}});
  }
}

function buildTabs() {
  var nav = document.getElementById('weekTabs');
  nav.innerHTML = '';
  for(var i=0;i<WEEKS.length;i++){
    (function(idx){
      var btn = document.createElement('button');
      btn.className = 'tab'+(idx===WEEKS.length-1?' active':'');
      btn.textContent = WEEKS[idx].label;
      btn.onclick = function(){
        var tabs = document.querySelectorAll('.tab');
        for(var j=0;j<tabs.length;j++) tabs[j].classList.remove('active');
        btn.classList.add('active');
        render(idx);
      };
      nav.appendChild(btn);
    })(i);
  }
}

buildTabs();
render(WEEKS.length-1);
</script>
</body>
</html>
